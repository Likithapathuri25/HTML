<!DOCTYPE html>
<html>
    <head>
        <meta charset = "UTF-8">
        <title>Html forms</title>
    </head>
    <body>
        <form action="frames.html"method="GET">
            <label for="username">username:</label>
            <input type = "text"id="username" placeholder="Doremon"minlength="6" maxlength ="15" ><br>

            <label for="password">password:</label>
            <input type="password" id="password" ><br>

            <label for="email">email:</label>
            <input type = "email"id="email"placeholder="nobithasuzuka@gmail.com"><br>
            
            <label for="phone">phone #:</label>
            <input type="tel" id ="phone"placeholder="123-456-7890" pattern="{0-9}{3}-{0-9}{3}-{0-9}{4}"><br>

            <label for="dob">dob:</label>
            <input type="date" id ="dob"><br>

            <label for="quantity">quantity:</label>
            <input type="number" id ="quantity"min="0"max="99"value=1><br>

            <label for="title">title:</label>

            <label for="Mr.">Mr.</label>
            <input type="radio"id="Mr."value="Mr."name="title">
            <label for="Ms.">Ms.</label>
            <input type="radio"id="Ms."value="Ms."name="title">
            <label for="Phd.">Phd.</label>
            <input type="radio"id="Phd."value="Phd."name="title"><br>

            <label for="payment">payment:</label>
            <select id ="payment">
                <option value="visa">visa</option>
                <option value = "credit">credit</option>
                <option value = "debit">debit</option>
            </select><br>

            <label for="subscibe">subscribe</label>
            <input type="checkbox" id="subscribe"><br>

            <label for="comment">comment</label>
            <textarea id="comment" row="2"cols="25"></textarea><br>

            <label for="file">file</label>
            <input type="file"id="file"accept="image/png/jpg"><br>

            <input type="reset"><br>
            <input type="submit">
        </form>
    </body>
</html>
